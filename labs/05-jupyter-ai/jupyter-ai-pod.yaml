# Lab 5 - JupyterLab + Jupyter AI (Jupyternaut) using NRP's hosted LLMs.
# Needs: PVC ml-data-YOURNAME, and a Secret with your NRP LLM token:
#   kubectl create secret generic nrp-llm-YOURNAME --from-literal=OPENAI_API_KEY=<token>
apiVersion: v1
kind: Pod
metadata:
  name: jupyter-ai-YOURNAME
  labels:
    owner: YOURNAME
spec:
  restartPolicy: Never
  containers:
    - name: notebook
      image: quay.io/jupyter/scipy-notebook:latest
      securityContext:
        runAsUser: 0                    # start as root just long enough to fix ownership
      env:
        - name: CHOWN_EXTRA             # give these folders to jovyan:users at startup
          value: /home/jovyan/work
        - name: CHOWN_EXTRA_OPTS
          value: "-R"                   # recursive, so Lab 2/4 files are included
      command: ["bash", "-c"]
      args:
        - |
          set -euo pipefail
          echo "Installing Jupyter AI (1-2 minutes)..."
          # install into the container, not the PVC
          pip install --quiet --no-cache-dir "jupyter-ai[jupyternaut]>=3.2"
          # hand /opt/conda back to jovyan's group
          fix-permissions "${CONDA_DIR}"     
          # Pre-select the model; "openai/" = any OpenAI-compatible endpoint.
          exec start-notebook.py \
            --JupyternautExtension.initial_language_model="openai/${NRP_MODEL}" \
            --JupyternautExtension.model_parameters="{\"openai/${NRP_MODEL}\": {\"api_base\": \"${OPENAI_BASE_URL}\"}}"
      ports:
        - containerPort: 8888
      env:
        - name: NRP_MODEL               # any id listed by the endpoint's /v1/models
          value: gpt-oss
        - name: OPENAI_BASE_URL
          value: https://ellm.nrp-nautilus.io/v1
        - name: OPENAI_API_KEY          # from the Secret; never paste tokens into YAML
          valueFrom:
            secretKeyRef:
              name: nrp-llm-YOURNAME
              key: OPENAI_API_KEY
      resources:
        requests: {cpu: "2", memory: 4Gi}
        limits:   {cpu: "2", memory: 4Gi}
      volumeMounts:
        - name: data
          mountPath: /home/jovyan/work
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ml-data-YOURNAME
